name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scheduler and Worker tests
        working-directory: worker
        run: node --test test/*.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Score the recorded test calls
        run: |
          for d in calls/runs/*/; do [ -d "$d" ] && python scripts/score_calls.py --label "$(basename "$d")"; done; true
