name: Simulate test calls
# Runs the ten scripted callers as text conversations against the live scheduler, scores them and commits them.
on:
  workflow_dispatch:
    inputs:
      label:
        description: "Run label, e.g. v1"
        required: true
      only:
        description: "Comma-separated case ids (blank = all ten)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: calls
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run the conversations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOOL_SECRET: ${{ secrets.TOOL_SECRET }}
        run: python scripts/sim_calls.py --label "${{ inputs.label }}" --only "${{ inputs.only }}"
      - name: Score them
        if: always()
        run: python scripts/score_calls.py --label "${{ inputs.label }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the conversations
        if: always()
        run: |
          git config user.name "Pranav Gudise"
          git config user.email "273664482+pg2342-hub@users.noreply.github.com"
          git add calls
          git diff --cached --quiet || (git commit -m "Simulate test calls (${{ inputs.label }})" && git pull --rebase -q && git push)
